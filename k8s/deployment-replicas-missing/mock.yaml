apiVersion: v1
kind: Namespace
metadata:
  name: replicas-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: replicas-lab
data:
  APP_MODE: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replicas-demo
  namespace: replicas-lab
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: replicas-demo
  template:
    metadata:
      labels:
        app: replicas-demo
    spec:
      # Deployment fix1: Incorrect node selectors can prevent scheduling.
      nodeSelector:
        troubleshooting-lab: nonexistent
      # nodeSelector: {}

      affinity:
        # Keep replicas on the same node for this lab.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: replicas-demo
              topologyKey: kubernetes.io/hostname

        podAntiAffinity: {}

      containers:
        - name: app
          image: nginx:1.28-alpine

          envFrom:
            - configMapRef:
                name: app-config

          args: ["nginx", "-g", "daemon off;"]

          resources:
            requests:
              # Deployment fix2: Excessive CPU requests can prevent scheduling.
              cpu: 1000m
              # cpu: 100m
              memory: 16Mi
            limits:
              memory: 64Mi